server:
  port: 8082

spring:
  application:
    name: compra-service
  datasource:
    # Por defecto apunta al Postgres local (puerto 5432). Para hablarle a la
    # base de la VM de Azure, levanta el tunel SSH en el puerto 15432 (ver
    # notas en el proyecto) y corre la app con:
    #   $env:DB_URL="jdbc:postgresql://localhost:15432/compra_service_db"
    #   $env:DB_USERNAME="<usuario_pg_vm>"
    #   $env:DB_PASSWORD="<password_pg_vm>"
    url: ${DB_URL:jdbc:postgresql://localhost:5432/compra_service_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      continue-on-error: false

compra-service:
  cache:
    # Minutos que se considera "fresca" una fila cacheada (licitaciones,
    # compras agiles, adjuntos) antes de volver a pedirla a Mercado Publico.
    ttl-minutos: 10

mercado-publico:
  licitacion:
    url: https://api.mercadopublico.cl/servicios/v1/publico
    ticket: A84949FD-A50D-40C4-A3D2-83791DFA28A3
  compra-agil:
    url: https://api2.mercadopublico.cl
    ticket: A84949FD-A50D-40C4-A3D2-83791DFA28A3
  adjuntos:
    url: https://adjunto.mercadopublico.cl/adjunto-compra-agil
    user-key: 41186b85826e80d1a0d445a6ce67d1a3
  auth:
    url: https://servicios-prd.mercadopublico.cl